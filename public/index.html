<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio de Correos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .endpoint {
            background: #f7f7f7;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .endpoint h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .endpoint code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .status {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Servicio de Correos</h1>
        <p>API para envío de correos electrónicos con Brevo</p>
        
        <div class="endpoint">
            <h3>POST /api/email/send</h3>
            <p>Envía un correo electrónico</p>
            <code>
                {
                    "to": "email@ejemplo.com",
                    "subject": "Asunto",
                    "htmlContent": "&lt;h1&gt;Hola&lt;/h1&gt;"
                }
            </code>
        </div>
        
        <div class="endpoint">
            <h3>GET /api/email/health</h3>
            <p>Verifica el estado del servicio</p>
        </div>
        
        <span class="status">✓ Servicio activo</span>
    </div>
</body>
</html>
